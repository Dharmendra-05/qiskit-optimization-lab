[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-resource-optimizer"
version = "0.1.0"
description = "Qiskit Fall Fest 2026 - Track 2: Constrained Green Energy Resource & Portfolio Allocation Solver using QAOA"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Dharmendra P." }
]
dependencies = [
    "qiskit>=1.0.0",
    "qiskit-aer>=0.14.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "rustworkx>=0.14.0",
    "scipy>=1.12.0",
    "jupyter>=1.0.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::scipy.sparse.SparseEfficiencyWarning",
]
